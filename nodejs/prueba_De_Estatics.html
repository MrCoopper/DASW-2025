<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba de Página Estática</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      margin: 0;
      padding: 20px;
    }
    header {
      background-color: #4CAF50;
      color: white;
      padding: 10px 0;
      text-align: center;
    }
    main {
      margin-top: 20px;
    }
    footer {
      text-align: center;
      margin-top: 30px;
      font-size: 0.9em;
      color: #555;
    }
  </style>
</head>
<body>

  <header>
    <h1>Bienvenido a la Página de Prueba</h1>
  </header>

  <main>
    <p>Este es un ejemplo básico de una página HTML estática que puedes servir desde un servidor.</p>
  </main>

  <footer>
    <p>&copy; 2025 Ejemplo de Página Estática</p>
  </footer>

</body>
</html>
