<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscar Usuario</title>
</head>
<body>
  <h1>Ejercicio</h1>
  <form id="formularioUsuario">
    <label for="idUsuario">ID de Usuario:</label>
    <input type="number" id="idUsuario" required>
    <button type="submit">Buscar</button>
  </form>

  <div id="respuesta"></div>

  <script>
    const formulario = document.getElementById('formularioUsuario');
    formulario.addEventListener('submit', function (e) {
      e.preventDefault();

      const idUsuario = document.getElementById('idUsuario').value;

      fetch(`https://jsonplaceholder.typicode.com/users/${idUsuario}`)
        .then(response => response.json())
        .then(data => {
          if (data.id) {
            document.getElementById('respuesta').innerHTML = `
              <p><strong>Nombre:</strong> ${data.name}</p>
              <p><strong>Email:</strong> ${data.email}</p>
              <p><strong>Telefono:</strong> ${data.phone}</p>
            `;
          } else {
            document.getElementById('respuesta').innerHTML = `<p>Usuario no encontrado</p>`;
          }
        })
        .catch(error => {
          document.getElementById('respuesta').innerHTML = `<p>Error al buscar usuario</p>`;
          console.error('Error:', error);
        });
    });
  </script>
</body>
</html>
